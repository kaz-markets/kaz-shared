name: ci

# The steps are the org reusable workflows. kaz-shared resolves its lockfile with
# --legacy-peer-deps, so node-ci is given that install command.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    uses: kaz-markets/.github/.github/workflows/node-ci.yml@main
    with:
      install-command: npm install --legacy-peer-deps

  lint:
    uses: kaz-markets/.github/.github/workflows/lint.yml@main

  arch:
    uses: kaz-markets/.github/.github/workflows/arch.yml@main
    with:
      install-flags: " --legacy-peer-deps"
